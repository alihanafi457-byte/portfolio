<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reysha Zahra Haptari — Portfolio</title>
  <style>
    /* ... (CSS lainnya sama seperti sebelumnya) ... */

    /* Hero Section - Foto Diperbesar, Background Foto Menyatu Otomatis */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: flex-end; /* Foto akan menempel di bawah */
      justify-content: center;
      background-color: #ffffff;
      overflow: hidden;
    }

    .hero-img-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end; /* Mengatur foto agar menempel di bawah */
      z-index: 1;
    }

    .hero-img-wrap img {
      /* Mengubah tinggi foto menjadi 100% agar memenuhi layar */
      height: 100%; 
      width: auto;
      max-width: 100%;
      object-fit: cover; /* Agar foto menutupi area tanpa distorsi */
      filter: contrast(105%) brightness(102%);
      /* Hapus properti mask-image agar foto tidak transparan */
    }

    .hero-text-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding-bottom: 4rem; /* Posisi teks di atas foto */
      width: 100%;
    }

    .hero-name {
      /* ... (Gaya teks besar) ... */
      mix-blend-mode: multiply; /* Agar teks menyatu dengan foto */
    }
    /* ... (CSS lainnya sama seperti sebelumnya) ... */
  </style>
</head>
<body>
  <!-- ... (Navigasi) ... -->

  <!-- Hero Section -->
  <section class="hero" id="home" style="padding: 0;">
    <div class="hero-img-wrap">
      <!-- GANTI "foto-reysha.jpeg" DENGAN NAMA FILE FOTO ANDA YANG SEBENARNYA -->
      <img src="foto-reysha.jpeg" alt="Reysha Zahra Haptari">
    </div>
    <div class="hero-text-content">
      <div class="hero-greeting">hi, i'm</div>
      <h1 class="hero-name">Reysha Zahra Haptari</h1>
    </div>
  </section>

  <!-- ... (Sisa Section Lainnya) ... -->

</body>
</html>
